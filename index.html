<!doctype html>
<html lang="en">
  <head>
<script>
window.addEventListener("error", (e) => document.body.innerHTML = "<pre style=\"color:red\">" + e.error ? (e.error.stack || e.error.message) : e.message + "</pre>");
window.addEventListener("unhandledrejection", (e) => document.body.innerHTML = "<pre style=\"color:red\">" + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + "</pre>");
</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnippetCore</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
